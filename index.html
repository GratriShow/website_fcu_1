<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue de films</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>

<body>

    <header>
        <p class="surtitre">Catalogue de films · Programme</p>
        <h1>Catalogue<br>de films</h1>

        <ul class="stats">
            <li>
                <span class="stat-label">Films</span>
                <span class="stat-valeur" id="stat-total">0</span>
            </li>
            <li>
                <span class="stat-label">Genres</span>
                <span class="stat-valeur" id="stat-genres">0</span>
            </li>
            <li>
                <span class="stat-label">Genre principal</span>
                <span class="stat-valeur" id="stat-top-genre">–</span>
            </li>
            <li>
                <span class="stat-label">Dernière sortie</span>
                <span class="stat-valeur" id="stat-recent">–</span>
            </li>
        </ul>
    </header>

    <main>

        <section class="formulaire">
            <h2>Ajouter un film</h2>

            <form>
                <label for="titre">Titre du film</label>
                <input type="text" id="titre" name="titre" placeholder="Ex : Avatar">

                <label for="date">Date de sortie</label>
                <input type="date" id="date" name="date">

                <label for="genre">Genre</label>
                <select id="genre" name="genre">
                    <option value="">Choisir un genre</option>
                    <option value="Action">Action</option>
                    <option value="Comédie">Comédie</option>
                    <option value="Drame">Drame</option>
                    <option value="Horreur">Horreur</option>
                    <option value="Science-fiction">Science-fiction</option>
                </select>

                <label for="image">Image du film</label>
                <input type="url" id="image" name="image" placeholder="https://...">

                <p id="erreur" class="erreur" role="alert"></p>

                <button type="submit">Ajouter au catalogue</button>
            </form>
        </section>

        <section class="catalogue">
            <div class="catalogue-entete">
                <h2>À l'affiche</h2>
                <input type="search" id="recherche" placeholder="Rechercher un titre">
            </div>

            <div class="films">
            </div>
        </section>

    </main>

</body>
</html>
